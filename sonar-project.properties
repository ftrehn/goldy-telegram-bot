sonar.projectKey=ftrehn_goldy-telegram-bot
sonar.organization=ftrehn

sonar.projectName=goldy-telegram-bot
sonar.links.homepage=https://github.com/ftrehn/goldy-telegram-bot
sonar.links.scm=https://github.com/ftrehn/goldy-telegram-bot
sonar.links.issue=https://github.com/ftrehn/goldy-telegram-bot/issues

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

sonar.python.version=3.14
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=junit.xml

sonar.exclusions=\
  src/goldy/_version.py,\
  src/goldy/infrastructure/persistence/migrations/**

# Must match .coveragerc, or Sonar reports the entry points as uncovered.
sonar.coverage.exclusions=\
  src/goldy/telegram_bot.py,\
  src/goldy/worker_app.py,\
  src/goldy/scheduler_app.py,\
  src/goldy/_version.py,\
  src/goldy/infrastructure/persistence/migrations/**

# Rules suppressed deliberately, each with the reason it cannot apply here.
# Ant-style globs only: Sonar does not expand {a,b} braces, so every path is
# listed on its own criterion.
sonar.issue.ignore.multicriteria=fakecreds,dialoggetters,dialogcallbacks

# S2068 flags any assignment to something named "password". Every hit is a
# fixture credential for a config loader whose field is literally called
# `password` — the name is what is under test and cannot be renamed away.
sonar.issue.ignore.multicriteria.fakecreds.ruleKey=python:S2068
sonar.issue.ignore.multicriteria.fakecreds.resourceKey=tests/**/*.py

# S7503 flags `async` without `await`. aiogram-dialog awaits every getter and
# every widget callback, so they are async by contract even when a particular
# one has nothing to await; making one sync breaks the protocol rather than
# tidying it. This mirrors the RUF029 exemption scoped in ruff.toml — keep the
# two in step.
sonar.issue.ignore.multicriteria.dialoggetters.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.dialoggetters.resourceKey=src/goldy/presentation/telegram/handlers/**/getters.py

sonar.issue.ignore.multicriteria.dialogcallbacks.ruleKey=python:S7503
sonar.issue.ignore.multicriteria.dialogcallbacks.resourceKey=src/goldy/presentation/telegram/handlers/**/callbacks.py
