[mypy]
mypy_path = src
plugins = pydantic.mypy, dature.mypy_plugin
files = src, tests
python_version = 3.14
strict = true
pretty = true
warn_return_any = true
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
allow_redefinition = true
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
show_error_codes = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true
namespace_packages = true
ignore_missing_imports = true
strict_bytes = true
local_partial_types = true

# pytest-specific settings
disallow_untyped_defs = true
no_implicit_optional = true
disallow_incomplete_defs = true
disallow_any_unimported = false

[mypy-tests.*]
# Allow assert statements in tests (pytest uses them for assertions)
# Allow method assignment for mocks
# Allow attr-defined for mock assertions
# Disable strict enum comparison checks for state transition tests
disable_error_code = assert-type, method-assign, attr-defined, comparison-overlap, unreachable

[mypy-goldy.infrastructure.mappers.adaptix_cart_summary_view_mapper]
# adaptix's `impl_converter` builds a converter out of the signature of a stub
# function and parses its source to make sure the body really is a stub: only
# `pass`, `...` or a docstring pass its check, and the generated body replaces
# whatever is written there. A declaration that promises a value and returns
# none is worth reporting everywhere else, so the code is disabled for this one
# module rather than globally.
disable_error_code = empty-body
