# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: true

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master

  path_filters:
    - "!uv.lock"
    - "!**/_version.py"
    - "!**/__pycache__/**"
    - "!src/goldy/infrastructure/persistence/migrations/**"

  path_instructions:
    - path: "src/goldy/domain/**"
      instructions: >-
        Domain layer. It must import nothing from application, infrastructure or
        presentation, and must contain no IO, no async and no framework types.
        Entities and aggregates inherit Entity / Aggregate; use Aggregate only
        when the type emits domain events. Value objects inherit ValueObject,
        implement _validate() with @override, and never override __post_init__.
        Value objects are keyword-only, except those stored as a SQLAlchemy
        composite — today FullName and UserPreferences, which the ORM rebuilds
        positionally. MessengerAccount must stay a mutable dataclass, because
        SQLAlchemy assigns to its attributes when loading a row. Domain services
        inherit BaseDomainService and hold no state. Authorization rules are
        objects, not `if` branches: SUBORDINATE_ROLES is the single source of
        truth for who may act on whom, so flag any re-statement of the two rules
        that already fall out of it — an administrator cannot touch another
        administrator, and nobody can block themselves. ADMIN is in no one's
        subordinate set on purpose; flag any code path that grants it.

    - path: "src/goldy/application/**"
      instructions: >-
        Application layer. Handlers inherit CommandHandler / QueryHandler, take
        collaborators in __init__ stored as Final, and implement handle() with
        @override. Flag any `except Exception` — handlers catch AppError or a
        specific subclass. Flag any handler that catches a failure, records it
        and returns normally: that makes the transaction pipeline commit
        partially applied work. Persistence goes through gateways, never
        repositories: UserCommandGateway hands back whole aggregates,
        UserQueryGateway returns views and never aggregates. Query gateways
        aggregate in the database — flag code that loads rows to count them in
        Python. Pipelines are registered in execution order
        (TransactionPipeline, then EventsPipeline); reversing them would write
        events to the outbox after the commit and stop being atomic.

    - path: "src/goldy/infrastructure/**"
      instructions: >-
        Infrastructure implements ports declared in application, and must not
        import setup — the composition root depends on adapters, never the
        reverse. Adapters must wrap third-party errors in InfrastructureError
        subclasses; flag any library exception that can escape an adapter.
        Persistence uses imperative SQLAlchemy mapping and the domain must stay
        free of ORM types; value objects cross through TypeDecorators, and
        multi-field ones through composite. A composite's column order must
        match the dataclass field order — swapping two columns swaps the values
        silently. Aggregates loaded from the database have no events_collection
        of their own, so the gateway injects the request-scoped one on every
        read. Event consumers must be idempotent: delivery is at-least-once and
        keys off OutboxMessage.id.

    - path: "src/goldy/presentation/**"
      instructions: >-
        Handlers dispatch a command or query through Sender; a handler that
        touches a gateway directly is a bug. Middleware order is load-bearing —
        dishka, timing, auth, i18n — because authentication needs the container
        and i18n needs the user authentication loads. The auth gate is
        fail-closed and handles its own AppError, since it runs before i18n;
        flag anything that lets an update past it other than /start or a shared
        contact. `contact.user_id == message.from_user.id` is the security
        boundary of the whole bot: Telegram lets a person forward somebody
        else's contact card, and registration links accounts by phone number.
        Never compare message text to "/start" — Telegram delivers
        /start@goldy_bot in groups; use CommandStart(). Treat
        callback_query.message as possibly an InaccessibleMessage and answer the
        callback instead of writing into it. Every Fluent key lives in
        common/text_keys.py, in both ru and en — flag any literal key at a call
        site. New domain errors must be rendered in handlers/errors.py. The
        locales directory must not become a Python package.

    - path: "src/goldy/setup/**"
      instructions: >-
        Configs are plain dataclasses; env mapping lives in a source factory and
        validation in a dature loader, as V.root(...) predicates whose messages
        name the environment variable. Secret fields must be listed in
        secret_field_names so a startup failure cannot log them. An EnvSource
        without a prefix matches by field name — flag a generic field name such
        as `path` or `host` that could collide with a system variable. Nothing
        may read the environment outside a loader: a container that read it
        itself could not be built for a test. dishka providers: APP scope only
        for things holding no per-request state; sessions, gateways and handlers
        are REQUEST. Handlers are grouped by what they need, not by who calls
        them — anything needing an IdentityProvider belongs in
        user_handlers_provider, which the worker container does not get. Flag
        any attempt to merge those groups to make a wiring error go away.
        Constructor parameter types must be importable at runtime — flag any
        move under `if TYPE_CHECKING`.

    - path: "tests/**"
      instructions: >-
        Arrange / Act / Assert, separated by blank lines. Tests are named by
        behaviour and outcome, not by method name; a docstring explains why the
        behaviour matters, and most need none. Fixtures live only in
        conftest.py, builders in tests/unit/factories/, stubs in
        tests/unit/stubs/ — flag any defined next to a test. Use
        pytest.mark.usefixtures for fixtures whose value the test never reads.
        Flag tests that assert library behaviour rather than our decisions —
        building a dishka container to assert dishka wires it is a test of
        dishka. Integration tests must resolve ports from the container, never
        construct adapters directly.

    - path: ".github/workflows/**"
      instructions: >-
        Third-party actions must be pinned to a full commit SHA with the version
        in a trailing comment. Checkout uses persist-credentials: false unless
        the job pushes. Permissions are least-privilege and declared per job.
        Flag any workflow that checks out pull-request code under
        pull_request_target. Secrets are unreadable in job-level `if`
        conditions, so flag a job gated that way — the guard belongs on the step.

  tools:
    ruff:
      enabled: true
    # ruff already covers this repo with select = ["ALL"]; a second linter would
    # only add duplicate comments.
    pylint:
      enabled: false
    flake8:
      enabled: false
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    markdownlint:
      enabled: true
    semgrep:
      enabled: true

chat:
  auto_reply: true
