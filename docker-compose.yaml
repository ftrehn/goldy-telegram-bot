# Deployment: the four services this bot is, plus the three it depends on.
#
# Everything is configured through .env — the same file .env.example documents.
# Nothing here carries a default password: a compose file that boots with
# guest/guest on a server is how a RabbitMQ ends up mining somebody's coins.
#
#   cp .env.example .env    # fill the token, the passwords and the price type
#   docker compose up -d
#
# Migrations run as their own one-shot service and the three long-running
# processes wait for it to finish. Running "alembic upgrade head" from the bot's
# entrypoint would mean three processes racing the same lock on every restart.

name: goldy

x-goldy: &goldy
  build:
    context: .
  image: goldy:latest
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    REDIS_HOST: redis
    RABBITMQ_HOST: rabbitmq
    POSTGRES_PORT: "5432"
    REDIS_PORT: "6379"
    RABBITMQ_PORT: "5672"
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    <<: *goldy
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  bot:
    <<: *goldy
    command: ["python", "-m", "goldy.telegram_bot"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    <<: *goldy
    command:
      ["taskiq", "worker", "goldy.worker_app:create_worker_taskiq_app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  scheduler:
    <<: *goldy
    command:
      ["taskiq", "scheduler", "goldy.scheduler_app:create_scheduler_taskiq_app"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
